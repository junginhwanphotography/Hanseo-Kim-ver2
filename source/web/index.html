    <script>
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      scrollTo(0, 0);
      document.documentElement.classList.add("is-inside");
      if (location.hash === "#" || location.hash === "#intro" || location.hash === "#photographs" || location.hash === "#recent") {
        history.replaceState(null, "", location.pathname + location.search);
      }
      function fitPhoneFrame() {
        var phone = window.matchMedia("(max-width: 720px)").matches;
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--hanseo-vh", Math.round(height) + "px");
        document.documentElement.style.setProperty("--hanseo-top", "0px");
        if (phone && window.scrollY) scrollTo(0, 0);
      }
      fitPhoneFrame();
      window.addEventListener("resize", fitPhoneFrame);
      if (window.visualViewport) {
        visualViewport.addEventListener("resize", fitPhoneFrame);
        visualViewport.addEventListener("scroll", fitPhoneFrame, { passive: true });
      }
    </script>

  <body>
    <div class="site" id="site">
      <aside class="side">
        <a class="side-name" href="./" data-nav="photographs-home">Hanseo Kim</a>

          <button type="button" data-nav="photographs" aria-expanded="false">photographs</button>
          <a href="#books" data-nav="books">books and printed work</a>
          <a href="#contact" data-nav="contact">contact</a>
          <ul class="side-collections" id="side-collections" hidden></ul>
        </nav>
      </aside>

      </div>

      <div class="paint-desk" id="paint-desk" hidden aria-hidden="true">
        <canvas class="paint-board" id="paint-board" aria-label="Drawing" style="touch-action: none"></canvas>
        <div class="paint" id="paint">
          <div class="paint-colors" role="group" aria-label="Colors">
            <button type="button" class="paint-color is-on" data-color="#d4533c" style="background:#d4533c" aria-label="Red" aria-pressed="true"></button>
            <button type="button" class="paint-color" data-color="#e48a32" style="background:#e48a32" aria-label="Orange" aria-pressed="false"></button>
            <button type="button" class="paint-color" data-color="#e2b33a" style="background:#e2b33a" aria-label="Yellow" aria-pressed="false"></button>
            <button type="button" class="paint-color" data-color="#6e9a4e" style="background:#6e9a4e" aria-label="Green" aria-pressed="false"></button>
            <button type="button" class="paint-color" data-color="#3f7c9a" style="background:#3f7c9a" aria-label="Blue" aria-pressed="false"></button>
            <button type="button" class="paint-color" data-color="#8d5d86" style="background:#8d5d86" aria-label="Purple" aria-pressed="false"></button>
          </div>
          <div class="paint-tools" role="group" aria-label="Tools">
            <button type="button" class="paint-tool is-on" data-tool="gpen" aria-label="G pen" aria-pressed="true">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 11.2 9.2c.5 1.2.4 2.2 0 3.1C10.6 13.4 9.4 14 8 14s-2.6-.6-3.2-1.7c-.4-.9-.5-1.9 0-3.1L8 1.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 7.2v6.2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
            <button type="button" class="paint-tool" data-tool="pencil" aria-label="Pencil" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.2 13.8 3.4 10 11.2 2.2l2.6 2.6L6 12.6 2.2 13.8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="paint-tool" data-tool="marker" aria-label="Marker" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 12.8 9.4 6.6" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M9.2 6.2 12.4 3l2.2 2.2-3.2 3.2z" fill="currentColor"/></svg>
            </button>
            <button type="button" class="paint-tool" data-tool="wiggle" aria-label="Wiggle" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8c1.2-2.4 2.2-2.4 3.2 0s2 2.4 3.2 0 2-2.4 3.2 0 2 2.4 3.4 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <button type="button" class="paint-tool" data-tool="eraser" aria-label="Eraser" aria-pressed="false">
              <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="5.2" width="11.6" height="6.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7.2 5.2v6.2" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
            </button>
            <button type="button" class="paint-tool" id="paint-undo" aria-label="Undo" disabled>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 4.2 3.2 7l3 2.8M3.6 7h5.2a4 4 0 1 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button type="button" class="paint-tool" id="paint-clear" aria-label="Clear">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 4.5h9M6.2 4.5V3.2h3.6v1.3M5 6.2l.5 7h5l.5-7" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

    <script src="sections/tags.js?v=14"></script>
    <script src="sections/hand.js?v=2"></script>
    <script src="sections/ink.js?v=26"></script>
    <script>
      const desk = document.getElementById("paint-desk");
      const board = document.getElementById("paint-board");
      const paintUndo = document.getElementById("paint-undo");
      const paintClear = document.getElementById("paint-clear");
      const boardCtx = board.getContext("2d");
      const paintStrokes = [];
      const paintTools = {
        gpen: { size: 22, erase: false, wiggle: false },
        pencil: { size: 2.2, erase: false, wiggle: false },
        marker: { size: 14, erase: false, wiggle: false },
        wiggle: { size: 4, erase: false, wiggle: true },
        eraser: { size: 28, erase: true, wiggle: false },
      };
      let paintTool = "gpen";
      let paintColor = "#d4533c";
      let paintStroke = null;
      let paintPointer = null;

      let paintNeedsSize = false;

      function sizeBoard() {
        if (paintStroke) {
          paintNeedsSize = true;
          return;
        }
        const rect = board.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.floor(rect.width * dpr));
        const height = Math.max(1, Math.floor(rect.height * dpr));
        if (board.width === width && board.height === height) return;
        board.width = width;
        board.height = height;
        boardCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        redrawBoard();
      }

      function paintPoint(event) {
        const rect = board.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top, t: performance.now() };
      }

      function traceStroke(ctx, stroke) {
        const points = stroke.points;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        if (points.length === 1) {
          ctx.lineTo(points[0].x + 0.01, points[0].y);
          return;
        }
        if (!stroke.wiggle) {
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
          return;
        }
        let dist = 0;
        for (let i = 1; i < points.length; i++) {
          const prev = points[i - 1];
          const point = points[i];
          const dx = point.x - prev.x;
          const dy = point.y - prev.y;
          const len = Math.hypot(dx, dy) || 1;
          dist += len;
          const mag = Math.sin(dist * 0.45) * 5;
          ctx.lineTo(point.x + (-dy / len) * mag, point.y + (dx / len) * mag);
        }
      }

      function gpenRadius(speed, size) {
        const slow = 0.12;
        const fast = 1.6;
        const pace = Math.min(1, Math.max(0, (speed - slow) / (fast - slow)));
        const weight = Math.pow(1 - pace, 1.4);
        return size * (0.18 + 0.36 * weight);
      }

      function gpenPointRadius(stroke, index) {
        const points = stroke.points;
        if (index === 0) return stroke.size * 0.46;
        const prev = points[index - 1];
        const point = points[index];
        const dist = Math.hypot(point.x - prev.x, point.y - prev.y);
        const dt = point.t != null && prev.t != null ? Math.max(8, point.t - prev.t) : 16;
        const raw = gpenRadius(dist / dt, stroke.size);
        const prevRadius = prev._r != null ? prev._r : stroke.size * 0.46;
        return prevRadius * 0.45 + raw * 0.55;
      }

      function drawGpenSpan(ctx, stroke, from) {
        const points = stroke.points;
        ctx.strokeStyle = stroke.color;
        ctx.fillStyle = stroke.color;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        const start = Math.max(0, from);
        if (start === 0 && points[0]) points[0]._r = stroke.size * 0.46;
        if (points.length === 1) {
          const radius = Math.max(0.9, points[0]._r);
          ctx.beginPath();
          ctx.arc(points[0].x, points[0].y, radius, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        for (let i = Math.max(1, start); i < points.length; i += 1) {
          points[i]._r = gpenPointRadius(stroke, i);
          const a = points[i - 1];
          const b = points[i];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len = Math.hypot(dx, dy) || 1;
          const steps = Math.max(1, Math.ceil(len / 2.4));
          for (let step = 0; step < steps; step += 1) {
            const t0 = step / steps;
            const t1 = (step + 1) / steps;
            const r0 = Math.max(0.9, a._r + (b._r - a._r) * t0);
            const r1 = Math.max(0.9, a._r + (b._r - a._r) * t1);
            ctx.beginPath();
            ctx.lineWidth = Math.max(1.6, r0 + r1);
            ctx.moveTo(a.x + dx * t0, a.y + dy * t0);
            ctx.lineTo(a.x + dx * t1, a.y + dy * t1);
            ctx.stroke();
          }
        }
      }

      function drawGpen(ctx, stroke) {
        drawGpenSpan(ctx, stroke, 0);
      }

      function drawStroke(stroke) {
        boardCtx.save();
        boardCtx.globalCompositeOperation = stroke.erase ? "destination-out" : "source-over";
        if (stroke.pen === "gpen" && !stroke.erase) {
          drawGpen(boardCtx, stroke);
          boardCtx.restore();
          return;
        }
        boardCtx.lineCap = "round";
        boardCtx.lineJoin = "round";
        boardCtx.lineWidth = stroke.size;
        boardCtx.strokeStyle = stroke.color;
        traceStroke(boardCtx, stroke);
        boardCtx.stroke();
        boardCtx.restore();
      }

      function redrawBoard() {
        boardCtx.save();
        boardCtx.setTransform(1, 0, 0, 1, 0, 0);
        boardCtx.clearRect(0, 0, board.width, board.height);
        boardCtx.restore();
        paintStrokes.forEach(drawStroke);
      }

      function clearPaint() {
        paintStroke = null;
        paintPointer = null;
        paintStrokes.length = 0;
        redrawBoard();
        syncPaintUi();
      }

      window.HanseoPaint = { clear: clearPaint };
      window.addEventListener("hanseo-seal", () => {
        if (window.HanseoInk) window.HanseoInk.seal(paintStrokes);
      });

      function syncPaintUi() {
        document.querySelectorAll("[data-tool]").forEach((button) => {
          const on = button.dataset.tool === paintTool;
          button.classList.toggle("is-on", on);
          button.setAttribute("aria-pressed", on ? "true" : "false");
        });
        document.querySelectorAll("[data-color]").forEach((button) => {
          const on = button.dataset.color === paintColor;
          button.classList.toggle("is-on", on);
          button.setAttribute("aria-pressed", on ? "true" : "false");
        });
        desk.classList.toggle("is-eraser", paintTool === "eraser");
        paintUndo.disabled = paintStrokes.length === 0;
      }

      document.getElementById("paint").addEventListener("click", (event) => {
        const toolButton = event.target.closest("[data-tool]");
        const colorButton = event.target.closest("[data-color]");
        if (toolButton) paintTool = toolButton.dataset.tool;
        if (colorButton) {
          paintColor = colorButton.dataset.color;
          if (paintTool === "eraser") paintTool = "gpen";
        }
        if (toolButton || colorButton) syncPaintUi();
      });

      paintUndo.addEventListener("click", () => {
        if (paintStroke) return;
        paintStrokes.pop();
        redrawBoard();
        syncPaintUi();
        if (window.HanseoInk) window.HanseoInk.schedule(paintStrokes);
      });

      paintClear.addEventListener("click", () => {
        clearPaint();
        if (window.HanseoInk) window.HanseoInk.cancel();
      });

      function clientPoint(clientX, clientY, time) {
        const rect = board.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
          t: time != null ? time : performance.now(),
        };
      }

      function beginStroke(point, pointerId) {
        if (paintStroke) return;
        const spec = paintTools[paintTool];
        paintPointer = pointerId;
        paintStroke = {
          size: spec.size,
          erase: spec.erase,
          wiggle: spec.wiggle,
          color: paintColor,
          pen: paintTool,
          at: Date.now(),
          points: [point],
        };
        paintStrokes.push(paintStroke);
        drawStroke(paintStroke);
        syncPaintUi();
        document.documentElement.classList.add("is-drawing");
        if (window.HanseoInk) window.HanseoInk.cancel();
      }

      function addPoint(point, touch) {
        if (!paintStroke) return;
        const last = paintStroke.points[paintStroke.points.length - 1];
        if (Math.hypot(point.x - last.x, point.y - last.y) < (touch ? 0.7 : 1.4)) return;
        paintStroke.points.push(point);
        if (paintStroke.pen === "gpen" && !paintStroke.erase) {
          boardCtx.save();
          boardCtx.globalCompositeOperation = "source-over";
          drawGpenSpan(boardCtx, paintStroke, paintStroke.points.length - 1);
          boardCtx.restore();
          return;
        }
        redrawBoard();
      }

      function finishStroke() {
        if (!paintStroke && paintPointer === null) return;
        paintPointer = null;
        paintStroke = null;
        document.documentElement.classList.remove("is-drawing");
        syncPaintUi();
        if (window.HanseoInk) window.HanseoInk.schedule(paintStrokes);
        if (paintNeedsSize) {
          paintNeedsSize = false;
          sizeBoard();
        }
      }

      let paintTouch = 0;
      let cancelFinish = 0;

      function finishIfCancelled() {
        clearTimeout(cancelFinish);
        cancelFinish = setTimeout(() => {
          if (paintPointer === "touch" && paintStroke) finishStroke();
        }, 80);
      }

      function keepStroke() {
        clearTimeout(cancelFinish);
      }

      board.addEventListener(
        "touchstart",
        (event) => {
          event.preventDefault();
          keepStroke();
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          if (paintStroke && paintPointer === "touch") {
            if (!paintTouch || paintTouch === touch.identifier) {
              paintTouch = touch.identifier;
              return;
            }
            finishStroke();
          }
          if (paintStroke) return;
          paintTouch = touch.identifier;
          beginStroke(clientPoint(touch.clientX, touch.clientY, event.timeStamp), "touch");
        },
        { passive: false }
      );

      board.addEventListener(
        "touchmove",
        (event) => {
          event.preventDefault();
          keepStroke();
          if (paintPointer !== "touch" || !paintStroke) return;
          const touch = [...event.touches].find((item) => item.identifier === paintTouch);
          if (!touch) return;
          addPoint(clientPoint(touch.clientX, touch.clientY, event.timeStamp), true);
        },
        { passive: false }
      );

      function endTouch(event) {
        if (paintPointer !== "touch") return;
        const ended = [...(event.changedTouches || [])].some((item) => item.identifier === paintTouch);
        if (!ended && paintTouch) return;
        event.preventDefault();
        keepStroke();
        finishStroke();
      }

      board.addEventListener("touchend", endTouch, { passive: false });
      board.addEventListener(
        "touchcancel",
        (event) => {
          event.preventDefault();
          finishIfCancelled();
        },
        { passive: false }
      );

      function addPointerPoints(event) {
        const list = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
        list.forEach((item) => {
          const time = item.timeStamp != null ? item.timeStamp : event.timeStamp;
          addPoint(clientPoint(item.clientX, item.clientY, time), false);
        });
      }

      board.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        if (paintStroke) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        beginStroke(clientPoint(event.clientX, event.clientY, event.timeStamp), event.pointerId);
        if (event.pointerType === "mouse") {
          try {
            board.setPointerCapture(event.pointerId);
          } catch (error) {}
        }
        event.preventDefault();
      });

      board.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        if (event.pointerId !== paintPointer || !paintStroke) return;
        event.preventDefault();
        addPointerPoints(event);
      });

      function endPaint(event) {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        if (event.pointerId !== paintPointer) return;
        finishStroke();
      }

      board.addEventListener("pointerup", endPaint);
      board.addEventListener("pointercancel", (event) => {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        endPaint(event);
      });
      sizeBoard();
      window.addEventListener("resize", sizeBoard);
    </script>

    <script src="sections/recent.js?v=3"></script>
    <script src="sections/books.js?v=1"></script>
    <script src="sections/contact.js?v=4"></script>
    <script src="sections/site.js?v=31"></script>
