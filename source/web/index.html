    <script>
      (function () {
        try {
          var saved = localStorage.getItem("hanseo-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("is-dark", dark);
        } catch (error) {
          document.documentElement.classList.toggle(
            "is-dark",
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
        }
      })();
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";
      scrollTo(0, 0);
      document.documentElement.classList.add("is-inside");
      if (location.hash === "#" || location.hash === "#intro") {
        history.replaceState(null, "", location.pathname + location.search);
      } else if (location.hash === "#recent") {
        history.replaceState(null, "", location.pathname + location.search + "#photographs");
      }
      function fitPhoneFrame() {
        var phone = window.matchMedia("(max-width: 720px)").matches;
        var viewport = window.visualViewport;
        var height = viewport ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--hanseo-vh", Math.round(height) + "px");
        document.documentElement.style.setProperty("--hanseo-top", "0px");
        if (phone && window.scrollY) scrollTo(0, 0);
      }
      fitPhoneFrame();
      window.addEventListener("resize", fitPhoneFrame);
      if (window.visualViewport) {
        visualViewport.addEventListener("resize", fitPhoneFrame);
        visualViewport.addEventListener("scroll", fitPhoneFrame, { passive: true });
      }
      // Start every home thumb as soon as the tiny boot list arrives.
      // First screen is high priority; the rest follow immediately at normal priority.
      function hanseoStartThumbs(urls) {
        var hash = location.hash.replace(/^#/, "");
        if (hash && hash !== "intro") return;
        if (!urls || !urls.length || window.__hanseoThumbsStarted) return;
        window.__hanseoThumbsStarted = true;
        urls.forEach(function (url, index) {
          if (index < 15) {
            var link = document.createElement("link");
            link.rel = "preload";
            link.as = "image";
            link.href = url;
            if (index < 8) link.fetchPriority = "high";
            document.head.appendChild(link);
          }
          var img = new Image();
          img.decoding = "async";
          img.fetchPriority = index < 8 ? "high" : "auto";
          img.src = url;
        });
      }
      var catalogPromise = fetch("catalog.json").then(function (res) {
        if (!res.ok) throw new Error("catalog");
        return res.json();
      });
      fetch("boot-thumbs.json")

          return res.ok ? res.json() : null;
        })
        .then(function (boot) {
          if (!boot) return;
          var dark = document.documentElement.classList.contains("is-dark");
          hanseoStartThumbs(dark ? boot.dark : boot.light);
        })
        .catch(function () {});

        catalog: catalogPromise,
        manifest: fetch("thumbs/manifest.json")
          .then(function (res) {
            return res.ok ? res.json() : {};
          })
          .catch(function () {
            return {};
          }),
      };

        const rect = board.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.floor(rect.width * dpr));
        const height = Math.max(1, Math.floor(rect.height * dpr));

        board.width = width;

      function paintPoint(event) {
        const rect = board.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top, t: performance.now() };
      }

      function traceStroke(ctx, stroke) {
        const points = stroke.points;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        if (points.length === 1) {
          ctx.lineTo(points[0].x + 0.01, points[0].y);
          return;
        }
        if (!stroke.wiggle) {
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
          return;
        }
        let dist = 0;
        for (let i = 1; i < points.length; i++) {
          const prev = points[i - 1];
          const point = points[i];
          const dx = point.x - prev.x;
          const dy = point.y - prev.y;
          const len = Math.hypot(dx, dy) || 1;
          dist += len;
          const mag = Math.sin(dist * 0.45) * 5;
          ctx.lineTo(point.x + (-dy / len) * mag, point.y + (dx / len) * mag);
        }
      }

      function gpenRadius(speed, size) {
        const slow = 0.12;
        const fast = 1.6;
        const pace = Math.min(1, Math.max(0, (speed - slow) / (fast - slow)));
        const weight = Math.pow(1 - pace, 1.4);
        return size * (0.18 + 0.36 * weight);
      }

      function gpenPointRadius(stroke, index) {
        const points = stroke.points;
        if (index === 0) return stroke.size * 0.46;
        const prev = points[index - 1];
        const point = points[index];
        const dist = Math.hypot(point.x - prev.x, point.y - prev.y);
        const dt = point.t != null && prev.t != null ? Math.max(8, point.t - prev.t) : 16;
        const raw = gpenRadius(dist / dt, stroke.size);
        const prevRadius = prev._r != null ? prev._r : stroke.size * 0.46;
        return prevRadius * 0.45 + raw * 0.55;
      }

      const fireworkPalette = [
        "#fff7d6",
        "#ffe566",
        "#ffb347",
        "#ff6b2d",
        "#ff3d6e",
        "#ff4fd8",
        "#c45cff",
        "#6ecbff",
        "#7dffb3",
        "#ffd166",
        "#ffffff",
        "#ff8f70",
      ];

      function rainbowColor(stroke, travel) {
        const palette = fireworkPalette;
        const shift = (stroke.hue0 || 0) / 30;
        const t = travel * 0.085 + shift;
        const i = Math.floor(t) % palette.length;
        const next = palette[(i + 1) % palette.length];
        const f = t - Math.floor(t);
        // Occasional hot spark whites.
        if (((travel * 17 + (stroke.hue0 || 0)) | 0) % 23 === 0) return "#fffaf0";
        const a = palette[(i + palette.length) % palette.length];
        return mixHex(a, next, f * f * (3 - 2 * f));
      }

      function mixHex(a, b, t) {
        const pa = parseInt(a.slice(1), 16);
        const pb = parseInt(b.slice(1), 16);
        const ar = (pa >> 16) & 255;
        const ag = (pa >> 8) & 255;
        const ab = pa & 255;
        const br = (pb >> 16) & 255;
        const bg = (pb >> 8) & 255;
        const bb = pb & 255;
        const r = Math.round(ar + (br - ar) * t);
        const g = Math.round(ag + (bg - ag) * t);
        const bl = Math.round(ab + (bb - ab) * t);
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
      }

      function pathTravel(points, endIndex) {
        let dist = 0;
        const last = Math.min(endIndex, points.length - 1);
        for (let i = 1; i <= last; i += 1) {
          dist += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
        }
        return dist;
      }

      function drawGpenSpan(ctx, stroke, from) {
        const points = stroke.points;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        const start = Math.max(0, from);
        if (start === 0 && points[0]) points[0]._r = stroke.size * 0.46;
        let travel = pathTravel(points, Math.max(0, start));
        if (points.length === 1) {
          const color = stroke.rainbow ? rainbowColor(stroke, travel) : stroke.color;
          ctx.fillStyle = color;
          const radius = Math.max(0.9, points[0]._r);
          ctx.beginPath();
          ctx.arc(points[0].x, points[0].y, radius, 0, Math.PI * 2);
          ctx.fill();
          return;
        }
        for (let i = Math.max(1, start); i < points.length; i += 1) {
          points[i]._r = gpenPointRadius(stroke, i);
          const a = points[i - 1];
          const b = points[i];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const len = Math.hypot(dx, dy) || 1;
          const steps = Math.max(1, Math.ceil(len / 2.4));
          for (let step = 0; step < steps; step += 1) {
            const t0 = step / steps;
            const t1 = (step + 1) / steps;
            const r0 = Math.max(0.9, a._r + (b._r - a._r) * t0);
            const r1 = Math.max(0.9, a._r + (b._r - a._r) * t1);
            const color = stroke.rainbow ? rainbowColor(stroke, travel + len * t0) : stroke.color;
            ctx.strokeStyle = color;
            ctx.beginPath();
            ctx.lineWidth = Math.max(1.6, r0 + r1);
            ctx.moveTo(a.x + dx * t0, a.y + dy * t0);
            ctx.lineTo(a.x + dx * t1, a.y + dy * t1);
            ctx.stroke();
          }
          travel += len;
        }
      }

      function drawGpen(ctx, stroke) {
        drawGpenSpan(ctx, stroke, 0);
      }

      function makeSprayDots(stroke, cx, cy, radius) {
        const dots = [];
        const count = 12 + ((Math.random() * 14) | 0);
        const base = stroke.travel || 0;
        for (let i = 0; i < count; i += 1) {
          const angle = Math.random() * Math.PI * 2;
          const r = radius * Math.sqrt(Math.random());
          dots.push({
            x: cx + Math.cos(angle) * r,
            y: cy + Math.sin(angle) * r,
            s: Math.random() < 0.3 ? 2 : 1,
            color: stroke.rainbow ? rainbowColor(stroke, base + i * 2.5) : stroke.color,
          });
        }
        stroke.travel = base + 18;
        return dots;
      }

      function appendSpray(stroke, point) {
        if (!stroke.particles) stroke.particles = [];
        const dots = makeSprayDots(stroke, point.x, point.y, stroke.size * 0.55);
        for (let i = 0; i < dots.length; i += 1) stroke.particles.push(dots[i]);
        return dots;
      }

      function drawSprayDots(ctx, dots) {
        for (let i = 0; i < dots.length; i += 1) {
          const dot = dots[i];
          ctx.fillStyle = dot.color;
          ctx.fillRect(Math.round(dot.x), Math.round(dot.y), dot.s, dot.s);
        }
      }

      function drawSpray(ctx, stroke) {
        if (!stroke.particles || !stroke.particles.length) return;
        drawSprayDots(ctx, stroke.particles);
      }

      function stopSprayLoop() {
        if (sprayRaf) cancelAnimationFrame(sprayRaf);
        sprayRaf = 0;
      }

      function runSprayLoop() {
        stopSprayLoop();
        let lastBurst = 0;
        const tick = (now) => {
          if (!paintStroke || paintStroke.pen !== "spray") {
            sprayRaf = 0;
            return;
          }
          if (now - lastBurst >= 32) {
            lastBurst = now;
            const last = paintStroke.points[paintStroke.points.length - 1];
            const dots = appendSpray(paintStroke, last);
            boardCtx.save();
            boardCtx.globalCompositeOperation = "source-over";
            drawSprayDots(boardCtx, dots);
            boardCtx.restore();
          }
          sprayRaf = requestAnimationFrame(tick);
        };
        sprayRaf = requestAnimationFrame(tick);
      }

      function drawLineSegments(ctx, stroke) {
        const points = stroke.points;
        if (!points.length) return;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = stroke.size;
        if (points.length === 1) {
          ctx.strokeStyle = stroke.rainbow ? rainbowColor(stroke, 0) : stroke.color;
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          ctx.lineTo(points[0].x + 0.01, points[0].y);
          ctx.stroke();
          return;
        }
        let dist = 0;
        let wiggleDist = 0;
        for (let i = 1; i < points.length; i += 1) {
          const prev = points[i - 1];
          const point = points[i];
          const dx = point.x - prev.x;
          const dy = point.y - prev.y;
          const len = Math.hypot(dx, dy) || 1;
          let x0 = prev.x;
          let y0 = prev.y;
          let x1 = point.x;
          let y1 = point.y;
          if (stroke.wiggle) {
            wiggleDist += len;
            const mag = Math.sin(wiggleDist * 0.45) * 5;
            x1 = point.x + (-dy / len) * mag;
            y1 = point.y + (dx / len) * mag;
            if (i > 1) {
              const pdx = prev.x - points[i - 2].x;
              const pdy = prev.y - points[i - 2].y;
              const plen = Math.hypot(pdx, pdy) || 1;
              const pmag = Math.sin((wiggleDist - len) * 0.45) * 5;
              x0 = prev.x + (-pdy / plen) * pmag;
              y0 = prev.y + (pdx / plen) * pmag;
            }
          }
          ctx.strokeStyle = stroke.rainbow ? rainbowColor(stroke, dist) : stroke.color;
          ctx.beginPath();
          ctx.moveTo(x0, y0);
          ctx.lineTo(x1, y1);
          ctx.stroke();
          dist += len;
        }
      }

      function drawStroke(stroke) {
        boardCtx.save();
        boardCtx.globalCompositeOperation = stroke.erase ? "destination-out" : "source-over";
        if (stroke.pen === "gpen" && !stroke.erase) {
          drawGpen(boardCtx, stroke);
          boardCtx.restore();
          return;
        }
        if (stroke.pen === "spray" && !stroke.erase) {
          drawSpray(boardCtx, stroke);
          boardCtx.restore();
          return;
        }
        if (stroke.rainbow && !stroke.erase) {
          drawLineSegments(boardCtx, stroke);
          boardCtx.restore();
          return;
        }
        boardCtx.lineCap = "round";
        boardCtx.lineJoin = "round";
        boardCtx.lineWidth = stroke.size;
        boardCtx.strokeStyle = stroke.color;
        traceStroke(boardCtx, stroke);
        boardCtx.stroke();
        boardCtx.restore();
      }

      function redrawBoard() {
        boardCtx.save();
        boardCtx.setTransform(1, 0, 0, 1, 0, 0);
        boardCtx.clearRect(0, 0, board.width, board.height);
        boardCtx.restore();
        paintStrokes.forEach(drawStroke);
      }

      function clearPaint() {
        stopSprayLoop();
        paintStroke = null;
        paintPointer = null;
        paintStrokes.length = 0;
        redrawBoard();
        syncPaintUi();
      }

      window.HanseoPaint = { clear: clearPaint };
      window.addEventListener("hanseo-seal", () => {
        if (window.HanseoInk) window.HanseoInk.seal(paintStrokes);
      });

      function syncPaintUi() {
        document.querySelectorAll("[data-tool]").forEach((button) => {
          const on = button.dataset.tool === paintTool;
          button.classList.toggle("is-on", on);
          button.setAttribute("aria-pressed", on ? "true" : "false");
        });
        document.querySelectorAll("[data-color]").forEach((button) => {
          const on = button.dataset.color === paintColor;
          button.classList.toggle("is-on", on);
          button.setAttribute("aria-pressed", on ? "true" : "false");
        });
        desk.classList.toggle("is-eraser", paintTool === "eraser");
        paintUndo.disabled = paintStrokes.length === 0;
      }

      document.getElementById("paint").addEventListener("click", (event) => {
        const toolButton = event.target.closest("[data-tool]");
        const colorButton = event.target.closest("[data-color]");
        if (toolButton) paintTool = toolButton.dataset.tool;
        if (colorButton) {
          paintColor = colorButton.dataset.color;
          if (paintTool === "eraser") paintTool = "gpen";
        }
        if (toolButton || colorButton) syncPaintUi();
      });

      paintUndo.addEventListener("click", () => {
        if (paintStroke) return;
        paintStrokes.pop();
        redrawBoard();
        syncPaintUi();
        if (window.HanseoInk) window.HanseoInk.schedule(paintStrokes);
      });

      paintClear.addEventListener("click", () => {
        clearPaint();
        if (window.HanseoInk) window.HanseoInk.cancel();
      });

      function clientPoint(clientX, clientY, time) {
        const rect = board.getBoundingClientRect();
        return {
          x: clientX - rect.left,
          y: clientY - rect.top,
          t: time != null ? time : performance.now(),
        };
      }

      function beginStroke(point, pointerId) {
        if (paintStroke) return;
        const spec = paintTools[paintTool];
        paintPointer = pointerId;
        const rainbow = paintColor === "rainbow";
        paintStroke = {
          size: spec.size,
          erase: spec.erase,
          wiggle: spec.wiggle,
          color: rainbow ? "#ed1c24" : paintColor,
          rainbow: rainbow,
          hue0: rainbow ? Math.random() * 360 : 0,
          travel: 0,
          pen: paintTool,
          at: Date.now(),
          points: [point],
          particles: spec.spray ? [] : null,
        };
        paintStrokes.push(paintStroke);
        if (paintStroke.pen === "spray") {
          const dots = appendSpray(paintStroke, point);
          boardCtx.save();
          boardCtx.globalCompositeOperation = "source-over";
          drawSprayDots(boardCtx, dots);
          boardCtx.restore();
          runSprayLoop();
        } else {
          drawStroke(paintStroke);
        }
        syncPaintUi();
        document.documentElement.classList.add("is-drawing");
        if (window.HanseoInk) window.HanseoInk.cancel();
      }

      function addPoint(point, touch) {
        if (!paintStroke) return;
        const last = paintStroke.points[paintStroke.points.length - 1];
        const minDist = paintStroke.pen === "spray" ? (touch ? 0.4 : 0.8) : touch ? 0.7 : 1.4;
        if (Math.hypot(point.x - last.x, point.y - last.y) < minDist) return;
        paintStroke.points.push(point);
        if (paintStroke.pen === "gpen" && !paintStroke.erase) {
          boardCtx.save();
          boardCtx.globalCompositeOperation = "source-over";
          drawGpenSpan(boardCtx, paintStroke, paintStroke.points.length - 1);
          boardCtx.restore();
          return;
        }
        if (paintStroke.pen === "spray" && !paintStroke.erase) {
          const dots = appendSpray(paintStroke, point);
          boardCtx.save();
          boardCtx.globalCompositeOperation = "source-over";
          drawSprayDots(boardCtx, dots);
          boardCtx.restore();
          return;
        }
        redrawBoard();
      }

      function finishStroke() {
        if (!paintStroke && paintPointer === null) return;
        stopSprayLoop();
        paintPointer = null;
        paintStroke = null;
        document.documentElement.classList.remove("is-drawing");
        syncPaintUi();
        if (window.HanseoInk) window.HanseoInk.schedule(paintStrokes);
        if (paintNeedsSize) {
          paintNeedsSize = false;
          sizeBoard();
        }
      }

      let paintTouch = 0;
      let cancelFinish = 0;

      function finishIfCancelled() {
        clearTimeout(cancelFinish);
        cancelFinish = setTimeout(() => {
          if (paintPointer === "touch" && paintStroke) finishStroke();
        }, 80);
      }

      function keepStroke() {
        clearTimeout(cancelFinish);
      }

      board.addEventListener(
        "touchstart",
        (event) => {
          event.preventDefault();
          keepStroke();
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          if (paintStroke && paintPointer === "touch") {
            if (!paintTouch || paintTouch === touch.identifier) {
              paintTouch = touch.identifier;
              return;
            }
            finishStroke();
          }
          if (paintStroke) return;
          paintTouch = touch.identifier;
          beginStroke(clientPoint(touch.clientX, touch.clientY, event.timeStamp), "touch");
        },
        { passive: false }
      );

      board.addEventListener(
        "touchmove",
        (event) => {
          event.preventDefault();
          keepStroke();
          if (paintPointer !== "touch" || !paintStroke) return;
          const touch = [...event.touches].find((item) => item.identifier === paintTouch);
          if (!touch) return;
          addPoint(clientPoint(touch.clientX, touch.clientY, event.timeStamp), true);
        },
        { passive: false }
      );

      function endTouch(event) {
        if (paintPointer !== "touch") return;
        const ended = [...(event.changedTouches || [])].some((item) => item.identifier === paintTouch);
        if (!ended && paintTouch) return;
        event.preventDefault();
        keepStroke();
        finishStroke();
      }

      board.addEventListener("touchend", endTouch, { passive: false });
      board.addEventListener(
        "touchcancel",
        (event) => {
          event.preventDefault();
          finishIfCancelled();
        },
        { passive: false }
      );

      function addPointerPoints(event) {
        const list = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
        list.forEach((item) => {
          const time = item.timeStamp != null ? item.timeStamp : event.timeStamp;
          addPoint(clientPoint(item.clientX, item.clientY, time), false);
        });
      }

      board.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        if (paintStroke) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        beginStroke(clientPoint(event.clientX, event.clientY, event.timeStamp), event.pointerId);
        if (event.pointerType === "mouse") {
          try {
            board.setPointerCapture(event.pointerId);
          } catch (error) {}
        }
        event.preventDefault();
      });

      board.addEventListener("pointermove", (event) => {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        if (event.pointerId !== paintPointer || !paintStroke) return;
        event.preventDefault();
        addPointerPoints(event);
      });

      function endPaint(event) {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        if (event.pointerId !== paintPointer) return;
        finishStroke();
      }

      board.addEventListener("pointerup", endPaint);
      board.addEventListener("pointercancel", (event) => {
        if (event.pointerType === "touch") {
          event.preventDefault();
          return;
        }
        endPaint(event);
      });
      sizeBoard();
      window.addEventListener("resize", sizeBoard);
    </script>
